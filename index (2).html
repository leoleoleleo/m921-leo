<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Présentation de [VOTRE PRÉNOM]</title>

    <style>
        /* Mise en page générale */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f2;
            color: #222222;
            line-height: 1.6;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        /* Présentation */
        header {
            margin-bottom: 40px;
        }

        h1 {
            margin-bottom: 10px;
            font-family: Georgia, serif;
            font-size: 3rem;
            color: #183642;
        }

        .intro {
            font-size: 1.25rem;
        }

        section {
            margin-bottom: 35px;
        }

        h2 {
            font-family: Georgia, serif;
            color: #183642;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin-bottom: 8px;
        }

        a {
            display: inline-block;
            padding: 10px 16px;
            background-color: #183642;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        a:hover {
            background-color: #285565;
        }

        /* Adaptation pour les petits écrans */
        @media (max-width: 600px) {
            main {
                padding: 40px 20px;
            }

            h1 {
                font-size: 2.2rem;
            }

            .intro {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>

    <main>
        <header>
            <h1>[VOTRE PRÉNOM]</h1>

            <p class="intro">
                [ÉCRIVEZ VOTRE PHRASE]
            </p>
        </header>

        <section>
            <h2>Mes compétences et envies</h2>

            <ul>
                <li>Design</li>
                <li>Photographie</li>
                <li>Développement web</li>
            </ul>
        </section>

        <section>
            <h2>Mon GitHub</h2>

            <p>
                Vous pouvez découvrir mes projets sur mon GitHub.
            </p>

            <a href="https://github.com/[VOTRE-PSEUDO]" target="_blank">
                Voir mon GitHub
            </a>
        </section>
    </main>

</body>
</html>
